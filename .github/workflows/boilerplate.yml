name: Boilerplate drift gate

on:
  schedule:
    # Weekly: catch boilerplate drift across the fleet (SECURITY/LICENSE/
    # dependabot/CI), not just on this repo's pushes.
    - cron: '45 1 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/boilerplate/**'
      - 'tools/boilerplate_check.py'

permissions: read-all

concurrency:
  group: boilerplate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    name: Boilerplate drift — fleet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Scan all own repos against canonical boilerplate
        run: python tools/boilerplate_check.py --fleet
