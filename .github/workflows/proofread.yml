name: Proofread (canon fleet scan)

on:
  schedule:
    # Weekly: catch retired-name drift across all repos, not just on pushes.
    - cron: '15 1 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/proofread.py'

permissions: read-all

concurrency:
  group: proofread-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canon:
    name: Canon scan — fleet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Scan all public repos for retired names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/proofread.py --fleet
